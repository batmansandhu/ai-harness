[package]
name = "harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI-Harness: Rust deterministic shell that routes subscription Claude through typed workflows."

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
harness-types = { path = "../harness-types" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
cersei = { git = "https://github.com/pacifio/cersei", branch = "main" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
